<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f5">
  <title>Our Memories 📸</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <div class="topbar">
    <a href="index.html">← Home</a>
  </div>

  <!-- ===== Albums list (grouped by month) ===== -->
  <section id="albumsView">
    <header class="page-head">
      <h1>Our Memories</h1>
      <p>Every trip, every day — saved forever.</p>
    </header>
    <div class="toolbar">
      <button class="btn btn-primary" id="newAlbumBtn">＋ New Album</button>
      <button class="btn btn-ghost" id="refreshBtn">↻ Refresh</button>
    </div>
    <div class="status" id="status"></div>
    <main id="albums"></main>
  </section>

  <!-- ===== Single album ===== -->
  <section id="albumView" hidden>
    <div class="album-nav"><a href="#" id="backLink">← All albums</a></div>
    <header class="page-head">
      <h1 id="albumTitle"></h1>
      <p id="albumMeta"></p>
    </header>
    <div class="toolbar">
      <button class="btn btn-primary" id="addPhotosBtn">＋ Add photos &amp; videos</button>
    </div>
    <div class="status" id="albumStatus"></div>
    <div class="media-grid" id="mediaGrid"></div>
  </section>

  <!-- ===== Create album / add files ===== -->
  <div class="modal" id="uploadModal">
    <form class="modal-box" id="uploadForm">
      <h2 id="uploadTitle">New Album</h2>

      <div id="albumFields">
        <label for="albumName">Album name</label>
        <input type="text" id="albumName" placeholder="e.g. Ooty Trip">
        <label for="albumDate">Date</label>
        <input type="date" id="albumDate">
        <label for="albumNote">Memory note</label>
        <textarea id="albumNote" placeholder="What made this trip special?"></textarea>
      </div>

      <label for="files">Photos &amp; videos (select many)</label>
      <input type="file" id="files" accept="image/*,video/*" multiple>
      <div class="file-count" id="fileCount"></div>

      <label for="key">Passphrase (only you two know it)</label>
      <input type="password" id="key" autocomplete="off" required>

      <div class="progress" id="progress" hidden>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="ptext" id="ptext"></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save to Drive</button>
      </div>
    </form>
  </div>

  <!-- ===== Viewer ===== -->
  <div class="modal viewer" id="viewer">
    <button class="nav prev" id="prevBtn" aria-label="Previous">‹</button>
    <div class="modal-box">
      <div class="stage" id="stage"></div>
      <div class="meta"><div class="date" id="viewCount"></div></div>
    </div>
    <button class="nav next" id="nextBtn" aria-label="Next">›</button>
    <button class="close" id="closeViewer" aria-label="Close">✕</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/memories.js"></script>
</body>
</html>
