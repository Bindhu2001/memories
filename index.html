  <title>Our 4 Year Anniversary 💕</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing">
  <!-- Photo collage background -->
  <div class="collage" aria-hidden="true">
    <div class="tile" style="background-image:url('images/collage/1.jpg')"></div>
    <div class="tile" style="background-image:url('images/collage/2.jpg')"></div>
    <div class="tile" style="background-image:url('images/collage/3.jpg')"></div>
    <div class="tile" style="background-image:url('images/collage/4.jpg')"></div>
    <div class="tile" style="background-image:url('images/collage/5.jpg')"></div>

  <div class="shade"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Happy Anniversary</p>
      <h1>Our 4 Year<br>Anniversary</h1>
      <div class="divider"><span>❤</span></div>
      <p class="verse">
        Four years of us.<br>
        Two imperfect hearts that fit perfectly together.<br>
        Every flaw, every laugh, every little moment,<br>
        every time we choose us. ❤️<br>
        <strong class="wish">And at 11:11, my wish is always you. ✨</strong>
      </p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="memories.html">Our Memories 📸</a>
      </div>
    </div>
